name: Update Market Weather

on:
  schedule:
    # 11:00 UTC = 16:30 IST, Monday–Friday
    - cron: '0 11 * * 1-5'
  workflow_dispatch:          # Allows manual runs from the Actions tab

permissions:
  contents: write             # Required so the bot can push data.json

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5          # Newer version (Node 24 ready)

      - name: Set up Python
        uses: actions/setup-python@v6      # Newer version (Node 24 ready)
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4

      - name: Run Market Weather fetcher
        run: python fetch_market_weather.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json – skipping commit"
          else
            git commit -m "Auto-update Market Weather data $(date -u +%Y-%m-%d)"
            git push
          fi
